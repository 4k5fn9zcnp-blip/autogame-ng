

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Game.ng - Spin & Win</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:Arial,sans-serif;

  background:#071b14;

  color:white;

  text-align:center;

}

header{

  padding:22px;

  background:#0c3022;

  font-size:25px;

  font-weight:bold;

  color:#43f59b;

}

main{padding:25px 15px}

h1{font-size:30px}

p{color:#c8d8d0}

.wheel-wrap{

  position:relative;

  width:min(310px,85vw);

  margin:30px auto;

}

canvas{width:100%;height:auto}

.pointer{

  position:absolute;

  top:-12px;

  left:50%;

  transform:translateX(-50%);

  color:#ffdf45;

  font-size:35px;

  z-index:2;

}

button{

  background:#35e98c;

  color:#062317;

  border:0;

  padding:16px 38px;

  border-radius:30px;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

}

button:disabled{opacity:.5}

.result{

  margin:22px auto;

  padding:18px;

  max-width:330px;

  background:#103c2b;

  border-radius:14px;

  font-size:20px;

}

.small{font-size:12px;color:#9eb5a8}

</style>

</head>

<body>

<header>AUTO GAME.NG</header>

<main>

<h1>🎉 SPIN & WIN 🎉</h1>

<p>Try your luck and enjoy the game!</p>

<div class="wheel-wrap">

<div class="pointer">▼</div>

<canvas id="wheel" width="600" height="600"></canvas>

</div>

<button id="spin">SPIN NOW</button>

<div class="result" id="result">

Your result will appear here!

</div>

<p class="small">Free entertainment game. Points are for fun only.

They have no cash value. No deposits or cash prizes are offered.</p>

</main>

<script>

const canvas=document.getElementById("wheel");

const ctx=canvas.getContext("2d");

const prizes=["5 POINTS","10 POINTS","20 POINTS",

"TRY AGAIN","50 POINTS","15 POINTS"];

const colors=["#16a765","#f4c542","#087c50",

"#d94c4c","#20bd79","#b58b25"];

const slice=Math.PI*2/prizes.length;

let rotation=0;

let spinning=false;

function draw(){

  ctx.clearRect(0,0,600,600);

  prizes.forEach((prize,i)=>{

    const start=rotation+i*slice;

    ctx.beginPath();

    ctx.moveTo(300,300);

    ctx.arc(300,300,285,start,start+slice);

    ctx.closePath();

    ctx.fillStyle=colors[i];

    ctx.fill();

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=5;

    ctx.stroke();

    ctx.save();

    ctx.translate(300,300);

    ctx.rotate(start+slice/2);

    ctx.textAlign="right";

    ctx.fillStyle="#ffffff";

    ctx.font="bold 27px Arial";

    ctx.fillText(prize,255,10);

    ctx.restore();

  });

  ctx.beginPath();

  ctx.arc(300,300,48,0,Math.PI*2);

  ctx.fillStyle="#ffffff";

  ctx.fill();

  ctx.fillStyle="#07502f";

  ctx.font="bold 24px Arial";

  ctx.textAlign="center";

  ctx.fillText("SPIN",300,308);

}

draw();

document.getElementById("spin").addEventListener("click",()=>{

  if(spinning)return;

  spinning=true;

  const button=document.getElementById("spin");

  const result=document.getElementById("result");

  button.disabled=true;

  result.textContent="Spinning...";

  const winner=Math.floor(Math.random()*prizes.length);

  const target=(Math.PI*2*5)+(Math.PI*2-(winner*slice+slice/2));

  const start=rotation;

  const finish=start+target;

  const duration=4000;

  const beginning=performance.now();

  function animate(now){

    const progress=Math.min((now-beginning)/duration,1);

    const ease=1-Math.pow(1-progress,4);

    rotation=start+(finish-start)*ease;

    draw();

    if(progress<1){

      requestAnimationFrame(animate);

    }else{

      result.textContent="🎉 "+prizes[winner]+"!";

      spinning=false;

      button.disabled=false;

    }

  }

  requestAnimationFrame(animate);

});

</script>

</body>

</html>
