
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Game.ng - Spin & Win</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#071b14;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{
 background:#0c3022;padding:22px;
 color:#43f59b;font-size:26px;font-weight:bold
}
main{padding:24px 14px}
h1{font-size:29px}
p{color:#c8d8d0}
.wheel-wrap{
 width:min(330px,88vw);margin:30px auto;
 position:relative
}
canvas{width:100%;height:auto}
.pointer{
 position:absolute;top:-13px;left:50%;
 transform:translateX(-50%);
 color:#ffdf45;font-size:38px;z-index:2
}
button{
 background:#35e98c;color:#062317;border:0;
 padding:16px 40px;border-radius:30px;
 font-size:19px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.result{
 max-width:350px;margin:22px auto;padding:20px;
 background:#103c2b;border-radius:15px;
 font-size:21px;line-height:1.5
}
.notice{
 max-width:350px;margin:20px auto;
 font-size:12px;color:#a9bdb2;line-height:1.5
}
</style>
</head>
<body>
<header>AUTO GAME.NG</header>
<main>
<h1>🎉 SPIN & WIN 🎉</h1>
<p>Spin the wheel and discover your demo prize!</p>

<div class="wheel-wrap">
 <div class="pointer">▼</div>
 <canvas id="wheel" width="600" height="600"></canvas>
</div>

<button id="spin">SPIN NOW</button>

<div class="result" id="result">
Your prize will appear here!
</div>

<div class="notice">
This is a free entertainment game. All displayed prizes
are demo points only and have no cash value. No real
money is awarded and no deposit is required.
</div>
</main>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const prizes=[
 "10K","20K","50K","100K",
 "200K","500K","1M"
];

const colors=[
 "#16a765","#f4c542","#087c50",
 "#d94c4c","#20bd79","#b58b25","#1687a5"
];

const slice=Math.PI*2/prizes.length;
let rotation=0;
let spinning=false;

function draw(){
 ctx.clearRect(0,0,600,600);

 prizes.forEach((prize,i)=>{
  const start=rotation+i*slice;
  ctx.beginPath();
  ctx.moveTo(300,300);
  ctx.arc(300,300,285,start,start+slice);
  ctx.closePath();
  ctx.fillStyle=colors[i];
  ctx.fill();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=5;
  ctx.stroke();

  ctx.save();
  ctx.translate(300,300);
  ctx.rotate(start+slice/2);
  ctx.textAlign="right";
  ctx.fillStyle="#fff";
  ctx.font="bold 29px Arial";
  ctx.fillText(prize,255,10);
  ctx.restore();
 });

 ctx.beginPath();
 ctx.arc(300,300,48,0,Math.PI*2);
 ctx.fillStyle="#fff";
 ctx.fill();
 ctx.fillStyle="#07502f";
 ctx.font="bold 24px Arial";
 ctx.textAlign="center";
 ctx.fillText("SPIN",300,308);
}

draw();

document.getElementById("spin").addEventListener("click",()=>{
 if(spinning)return;

 spinning=true;
 const button=document.getElementById("spin");
 const result=document.getElementById("result");

 button.disabled=true;
 result.textContent="Good luck! Spinning...";

 const winner=Math.floor(Math.random()*prizes.length);
 const target=Math.PI*2*5+
  (Math.PI*2-(winner*slice+slice/2));

 const start=rotation;
 const finish=start+target;
 const duration=4000;
 const beginning=performance.now();

 function animate(now){
  const progress=Math.min((now-beginning)/duration,1);
  const ease=1-Math.pow(1-progress,4);

  rotation=start+(finish-start)*ease;
  draw();

  if(progress<1){
   requestAnimationFrame(animate);
  }else{
   result.innerHTML=
    "🎉 Congratulations! 🎉<br><br>"+
    "You got "+prizes[winner]+" demo points!<br><br>"+
    "You can now grab your demo prize!";

   spinning=false;
   button.disabled=false;
  }
 }

 requestAnimationFrame(animate);
});
</script>
</body>
</html>
